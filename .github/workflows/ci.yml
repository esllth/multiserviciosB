name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    name: Build, test, and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore application and test dependencies
        run: dotnet restore Tests/MultiservicioB.Tests.csproj

      - name: Build tests and application
        run: dotnet build Tests/MultiservicioB.Tests.csproj --configuration Release --no-restore

      - name: Run unit and integration tests with coverage
        run: >-
          dotnet test Tests/MultiservicioB.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=tests.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Publish application artifact
        if: success() && github.event_name != 'pull_request'
        run: |
          dotnet publish MultiservicioB.csproj --configuration Release --no-restore --output artifacts/publish
          rm -f artifacts/publish/appsettings.Development.json

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload deployable application artifact
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: multiservicioB-${{ github.sha }}
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 30
